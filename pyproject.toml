[project]
name = "albericus"
version = "0.1.0"
description = "Aplicativo desktop para emparceiramento de torneios de xadrez."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "fastapi>=0.111.0",
    "markdown>=3.6",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-chess>=1.999",
    "qrcode[pil]>=7.4.2",
    "reportlab>=4.2.0",
    "svglib>=1.6.0",
    "tkcalendar>=1.6.1",
    "uvicorn>=0.30.0",
    "xhtml2pdf>=0.2.15",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11.0",
]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
    "Manual",
    "FIDE",
    "backups",
    "data",
    "docs",
    "*.rej",
    "diff_*.txt",
    "fix.py",
    "recover.py",
    "scratch_*.py",
    "test_swiss.py",
    "unmangle.py",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/core/services.py" = ["F401", "F403", "I001"]
"src/services/*.py" = ["F401", "F403", "F405", "I001"]
"src/ui/app.py" = ["F403", "F405", "I001"]
"src/ui/screens/*.py" = ["E701", "F401", "F403", "F405", "I001"]
"src/ui/screens/__init__.py" = ["F401"]
"src/ui/support.py" = ["F401", "I001"]
"src/database/migrations/legacy_migrations.py" = ["F401", "I001"]
"tests/test_pairing.py" = ["E722", "I001"]

[tool.mypy]
python_version = "3.11"
files = ["src/core"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true

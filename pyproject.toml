[project]
name = "albericus"
version = "0.1.0"
description = "Aplicativo desktop para emparceiramento de torneios de xadrez."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "svglib>=1.6.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11.0",
]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ui.py" = ["F403", "F405"]
"src/ui_admin.py" = ["F403", "F405"]
"src/ui_club.py" = ["F403", "F405"]
"src/ui_pairings.py" = ["F403", "F405"]
"src/ui_settings.py" = ["F403", "F405"]
"src/ui_tournaments.py" = ["F403", "F405"]
"src/ui_support.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/core"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true
